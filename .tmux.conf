bind -n C-s respawn-pane -k

bind -n C-Tab next-window
bind -n C-BTab previous-window
bind -n C-PageUp previous-window
bind -n C-PageDown next-window

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-0 select-window -t 10

bind -n C-t new-window
bind -n C-q kill-window

bind k send-keys -t.- 'tmkill' Enter

set -g default-shell /usr/bin/fish
set -g extended-keys on
set -g extended-keys-format csi-u
set -sg escape-time 0

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g mouse on
set -g set-titles on
set -g set-titles-string '#W'
setw -g automatic-rename on
set -g focus-events on

set -g status-style "bg=default,fg=white"
set -g status-left ""
set -g status-right ""
set -g status-justify centre
set -g window-status-current-format "#[fg=magenta]#[fg=black,bg=magenta]#I #[fg=white,bg=brightblack] #W#[fg=brightblack,bg=default] "
set -g window-status-format "#[fg=yellow]#[fg=black,bg=yellow]#I #[fg=white,bg=brightblack] #W#[fg=brightblack,bg=default] "
