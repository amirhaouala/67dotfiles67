general {
    grace = 0
    fractional_scaling = 2
    immediate_render = true
}

# Background
background {
    path = $HOME/Pictures/Hyprlock/Routine.jpg
}

# Time
label {
    text = cmd[update:1000] echo "$(date +"%I:%M %p")"
    color = rgba(220, 220, 220, 0.95)
    font_size = 173
    position = 0, -133
    halign = center
    valign = top
}

# Input Field
input-field {
    size = 306, 93
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(220, 220, 220, 0.95)
    inner_color = rgba(255, 255, 255, 0.1)
    capslock_color = rgb(255,255,255)
    font_color = rgba(255, 185, 0, 0.9)
    fade_on_empty = false
    placeholder_text = 🔒 Type Password
    hide_input = false
    position = 0, 100
    halign = center
    valign = bottom
}

# Keyboard Layout
label {
    text = $LAYOUT
    color = rgba(220, 220, 220, 0.95)
    font_size = 10
    position = 0, 160
    halign = center
    valign = bottom
}