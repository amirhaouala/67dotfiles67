shell fish

font_size               12
font_family             JetBrainsMono Nerd Font Mono
symbol_map U+0600-U+06FF,U+0750-U+077F,U+08A0-U+08FF,U+FB50-U+FDFF,U+FE70-U+FEFF Vazirmatn

adjust_line_height 110%

cursor_blink_interval        0.5
cursor_stop_blinking_after   1
cursor_trail 2
cursor #FABD2F

window_padding_width    6

update_check_interval   0
confirm_os_window_close 0
enable_audio_bell       no

map ctrl+tab send_text all \x1b[27;5;9~
map ctrl+shift+tab send_text all \x1b[27;6;9~

selection_foreground     #EBDBB2
selection_background     #D65D0E

background #272727
foreground #EBDBB2

color0                   #3C3836
color1                   #CC241D
color2                   #98971A
color3                   #D79921
color4                   #458588
color5                   #B16286
color6                   #689D6A
color7                   #A89984
color8                   #928374
color9                   #FB4934
color10                  #B8BB26
color11                  #FABD2F
color12                  #83A598
color13                  #D3869B
color14                  #8EC07C
color15                  #FBF1C7

cursor_text_color        #665C54

